# Loaded as /etc/nginx/conf.d/default.conf (inside the http {} context).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # --- compression ---
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # --- security headers (CSP allows only our own origin plus WebSocket to it) ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Docker's embedded DNS. Resolving per request (via a variable) lets nginx start before
  # the game server is up and keeps working when the server container gets a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Game WebSocket
  location /ws {
    set $game_server http://server:8080;
    proxy_pass $game_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  # Liveness/readiness/metrics of the game server through the proxy (health and readiness only).
  location ~ ^/(healthz|readyz)$ {
    set $game_server http://server:8080;
    proxy_pass $game_server;
    proxy_set_header Host $host;
    access_log off;
  }

  # Fingerprinted build output can be cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # add_header in a location drops the server-level headers, so repeat the important ones.
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The HTML shell must always be revalidated so new deploys are picked up.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }
}
